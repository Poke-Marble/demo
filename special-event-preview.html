<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poké Marble · 특수 연출 DEMO</title>
    <style>
      body {
        margin: 0;
        background: #102333;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      .demo-tools {
        padding: 16px;
        background: #182d40;
      }
      .demo-tools p {
        margin: 0 0 12px;
      }
      .demo-tools button {
        padding: 10px;
        margin: 4px;
        min-height: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <nav class="demo-tools" aria-label="격리 데모 장면">
      <p>
        특수 연출 DEMO · 결과는 고정 데이터입니다. 실제 시험 규칙·경제·AI
        미연결. 1 PLAYER + 3 COMPUTER
      </p>
      <button data-scenario="success">시험 성공 · 루기아</button>
      <button data-scenario="failure">시험 실패 · 칠색조</button>
      <button data-scenario="rope">탈출로프</button>
      <button data-scenario="fly">공중날기</button>
      <button data-scenario="fly-trial">비행 후 시험</button>
      <button id="redeliver">마지막 요청 중복 전달</button>
      <button id="restart">재시작</button>
      <button id="restart-during">1초 뒤 강제 재시작 QA</button>
    </nav>
    <div id="special-preview"></div>
    <script type="module" src="/src/ui/game/demo/special-main.ts"></script>
  </body>
</html>
